# Render Blueprint Specification for SchoolConnect Full-Stack Deployment
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  # Managed PostgreSQL Database on Render
  - name: schoolconnect-postgres
    plan: free
    databaseName: schoolconnect
    user: schoolconnect_user
    region: oregon
    ipAllowList: []

services:
  # Backend Node.js / Express API Service
  - type: web
    name: schoolconnect-backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:push && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: schoolconnect-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: "*"

  # Frontend React Static Site on Render
  - type: web
    name: schoolconnect-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: schoolconnect-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: schoolconnect-backend
          property: host
